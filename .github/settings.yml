# Repository settings, synced by the Settings app (https://github.com/apps/settings)
# from the default branch. Once this is live, main can only change through a reviewed PR.
# Every other branch is writable; main's protection is what guards it.

repository:
  # Merging the editing -> main PR must not delete the editing branch (the CMS writes there).
  delete_branch_on_merge: false

branches:
  - name: main
    protection:
      # GitHub never counts a PR author's own approval, so a second person (or the
      # actions bot opening the PR) is what makes the approval independent.
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks: null
      # Applies to admins too, so an admin's CMS token cannot push straight to main.
      enforce_admins: true
      # Team/user push restrictions are only available on organisation-owned repos.
      restrictions: null
