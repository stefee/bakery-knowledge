# Opens a PR merging `editing` into `main` so CMS edits can be reviewed before they land.
# Triggered from the Pages CMS Actions page (see `actions` in .pages.yml).
name: Open editing PR

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

concurrency:
  group: open-editing-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open or find the editing PR
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --base main --head editing --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "A PR from editing to main is already open: $existing"
            echo "### Already open" >> "$GITHUB_STEP_SUMMARY"
            echo "$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ahead=$(gh api "repos/$GH_REPO/compare/main...editing" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "editing has no commits that main lacks; nothing to open."
            echo "### Nothing to merge" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          who=$(jq -r '.triggeredBy.name // .triggeredBy.login // "Pages CMS"' <<< "$PAYLOAD")
          url=$(gh pr create \
            --base main \
            --head editing \
            --title "Merge CMS edits from editing" \
            --body "Review of edits made through the CMS on the \`editing\` branch ($ahead commit(s)).

          Requested from Pages CMS by $who.")
          echo "### Opened PR" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
