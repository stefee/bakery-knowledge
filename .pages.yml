# Pages CMS config for editing an OKF v0.2 bundle (see open-knowledge-format/SPEC.md).
# Deliberately covers only a subset of the spec. Fields not listed here (resource, generated,
# sources, stale_after, computation fields, ...) are not exposed for editing.
# Timestamps are plain strings (ISO 8601 with explicit offset, e.g. 2026-06-30T14:00:00Z):
# Pages CMS date formatting uses local time, which cannot emit a true UTC "Z".

actions:
  - name: open-editing-pr
    label: Open PR to main
    workflow: open-editing-pr.yml
    ref: main
    cancelable: false
    confirm:
      title: Open a pull request?
      message: Opens a PR merging the editing branch into main for review.
      button: Open PR

content:
  # --- Concepts (SPEC §4): every .md except the reserved index.md / log.md ---
  - name: concepts
    label: Concepts
    type: collection
    path: knowledge/hearth-and-wheel
    format: yaml-frontmatter
    subfolders: true
    exclude: ["index.md", "log.md"]
    view:
      fields: [type, title, status, tags]
      primary: title
      sort: [title]
    fields:
      # Required (§4.1)
      - name: type
        label: Type
        type: string
        required: true
        description: Kind of concept, e.g. Metric, System, Process, Schedule. Types are not registered centrally.
      # Recommended (§4.1)
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
        description: A single sentence summarising the concept.
      - name: tags
        label: Tags
        type: string
        list: true
      # Lifecycle (§5.4)
      - name: status
        label: Status
        type: select
        options:
          values: [draft, stable, deprecated]
        description: Absent means stable.
      # Trust (§5.2)
      - name: verified
        label: Verified
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{by} ({at})"
        fields:
          - name: by
            label: By
            type: string
            required: true
            description: Actor. Use the human:<id> prefix for people.
          - name: at
            label: At
            type: string
      # Producer-defined extension used by this bundle (disambiguation)
      - name: not
        label: Not (disambiguation)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{term}"
        fields:
          - name: term
            label: Term
            type: string
          - name: why
            label: Why
            type: text
          - name: instead
            label: Instead
            type: text
      # Body (§4.2)
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown

  # --- Reserved files (§8, §9) ---
  - name: root-index
    label: Bundle root index
    type: file
    path: knowledge/hearth-and-wheel/index.md
    format: yaml-frontmatter
    fields:
      - name: okf_version
        label: OKF version
        type: string
        description: The only frontmatter permitted in an index.md.
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown

  - name: log
    label: Bundle log
    type: file
    path: knowledge/hearth-and-wheel/log.md
    format: raw

  # Folder indexes carry no frontmatter (§8).
  - name: bakehouse-index
    label: Bakehouse index
    type: file
    path: knowledge/hearth-and-wheel/bakehouse/index.md
    format: raw

  - name: wholesale-round-index
    label: Wholesale Round index
    type: file
    path: knowledge/hearth-and-wheel/wholesale-round/index.md
    format: raw

  - name: shop-and-customer-line-index
    label: Shop and Customer Line index
    type: file
    path: knowledge/hearth-and-wheel/shop-and-customer-line/index.md
    format: raw

